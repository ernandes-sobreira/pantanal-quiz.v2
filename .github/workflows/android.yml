name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pantanal-quiz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK para download direto (versão de teste)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teste-apk
          name: Pantanal Quiz — APK de teste
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            APK de teste para instalação manual no Android.
            Não é versão de produção e pode conter erros.
